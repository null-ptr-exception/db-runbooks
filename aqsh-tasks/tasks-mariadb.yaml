# Task definitions for the MariaDB runbook image.
#
# Pulled in via `include:` from `task-mariadb.yaml`, which owns the global
# `defaults:` (timeout / max_retry / queue). An included file MUST NOT define
# its own `defaults:` — aqsh rejects the whole config if it does.
tasks:
  common/hello:
    script: common/hello.sh
    timeout: 1m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: name
        env: NAME
        required: true
        type: string
  restart:
    script: mariadb/restart.sh
    description: "Operator-driven restart of a MariaDB cluster by patching the MariaDB CR restart annotation"
    timeout: 8m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: resource
        env: MARIADB_RESOURCE
        required: false
        type: string
        default: mariadb
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
      - name: container
        env: MARIADB_CONTAINER
        required: false
        type: string
        default: mariadb
      - name: wait_timeout
        env: WAIT_TIMEOUT
        required: false
        type: string
        default: "300"
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
      - name: annotation_key
        env: RESTART_ANNOTATION_KEY
        required: false
        type: string
        default: aqsh.null-ptr-exception.dev/restarted-at
      - name: metadata_field
        env: RESTART_METADATA_FIELD
        required: false
        type: string
        default: auto
  switch-primary:
    script: mariadb/switch-primary.sh
    description: "Promote a replica to primary within one replicated MariaDB (AWS RDS FailoverDBCluster); operator-driven graceful switchover. Target is optional — omit it to auto-pick the most caught-up healthy replica."
    # Headroom for the forward switch (WAIT_TIMEOUT, 300s) plus bounded recovery
    # (rollback + optional eviction, RECOVERY_TIMEOUT each) so the final status
    # always gets emitted within the task budget.
    timeout: 15m
    allowed_groups: ["system:serviceaccounts"]
    # Note: the lag policy (LAG_THRESHOLD) and the auto-rollback safety behaviour
    # (ROLLBACK_ON_TIMEOUT) are deliberately NOT task inputs — they are
    # per-deployment policy / safety, env-overridable internal config only.
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: target
        env: TARGET_POD_INDEX
        required: false
        type: string
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
      - name: wait_timeout
        env: WAIT_TIMEOUT
        required: false
        type: string
        default: "300"
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  set-runtime-param:
    script: mariadb/set-runtime-param.sh
    description: "Emergency online override of a MariaDB runtime parameter via SET GLOBAL (AWS RDS ModifyDBParameterGroup, dynamic). EPHEMERAL — reverts on restart; durable changes go through a config PR. Omit param to list supported params."
    timeout: 5m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: param
        env: RUNTIME_PARAM
        required: false
        type: string
        pattern: '^[a-z_]*$'
      - name: value
        env: RUNTIME_VALUE
        required: false
        type: string
      - name: scope
        env: RUNTIME_SCOPE
        required: false
        type: string
        default: "all"
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  status:
    script: mariadb/status.sh
    description: "Read-only MariaDB status summary for operator and native StatefulSet targets"
    timeout: 2m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: resource
        env: MARIADB_RESOURCE
        required: false
        type: string
        default: mariadb
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
      - name: container
        env: MARIADB_CONTAINER
        required: false
        type: string
        default: mariadb
      - name: include_sql
        env: INCLUDE_SQL
        required: false
        type: string
        default: "true"
  connection-usage:
    script: mariadb/connection-usage.sh
    description: "Read-only point-in-time MariaDB connection usage grouped by database account across all instance pods"
    timeout: 2m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: account_limit
        env: ACCOUNT_LIMIT
        required: false
        type: string
        default: "10"
        pattern: '^([1-9]|[1-4][0-9]|50)$'
  sanity-check: &mariadb_sanity_check_task
    script: mariadb/sanity-check.sh
    description: "Read-only MariaDB health check: operator, service, SQL, replication, and semi-sync"
    timeout: 5m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: resource
        env: MARIADB_RESOURCE
        required: false
        type: string
        default: mariadb
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
      - name: container
        env: MARIADB_CONTAINER
        required: false
        type: string
        default: mariadb
      - name: lag_threshold
        env: LAG_THRESHOLD
        required: false
        type: string
        default: "1"
      - name: conn_warn_pct
        env: CONN_WARN_PCT
        required: false
        type: string
        default: "80"
      - name: long_tx_threshold
        env: LONG_TX_THRESHOLD
        required: false
        type: string
        default: "10"
      - name: expected_version
        env: EXPECTED_VERSION
        required: false
        type: string
        default: ""
      - name: check_operator
        env: CHECK_OPERATOR
        required: false
        type: string
        default: "true"
      - name: check_pods
        env: CHECK_PODS
        required: false
        type: string
        default: "true"
      - name: check_service
        env: CHECK_SERVICE
        required: false
        type: string
        default: "true"
      - name: check_sql
        env: CHECK_SQL
        required: false
        type: string
        default: "true"
      - name: check_replication
        env: CHECK_REPLICATION
        required: false
        type: string
        default: "true"
      - name: check_semi_sync
        env: CHECK_SEMI_SYNC
        required: false
        type: string
        default: "true"
  mariadb_sanity_check: *mariadb_sanity_check_task
  create-account:
    script: mariadb/create-account.sh
    description: "Create a new MariaDB account and grant scoped database privileges"
    timeout: 5m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: resource
        env: MARIADB_RESOURCE
        required: false
        type: string
        default: mariadb
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
      - name: container
        env: MARIADB_CONTAINER
        required: false
        type: string
        default: mariadb
      - name: database
        env: ACCOUNT_DATABASE
        required: true
        type: string
      - name: username
        env: ACCOUNT_USERNAME
        required: true
        type: string
      - name: host
        env: ACCOUNT_HOST
        required: false
        type: string
        default: "%"
      - name: privileges
        env: ACCOUNT_PRIVILEGES
        required: true
        type: string
      # The password Secret is a managed-database internal: its name is derived by
      # convention (mariadb-account-<username>), its key defaults to "password",
      # and the result returns it as password_secret.{name,key}. Not task inputs;
      # ACCOUNT_PASSWORD_SECRET_NAME / _KEY / _PREFIX stay as env overrides only.
      - name: generate_password
        env: GENERATE_PASSWORD
        required: false
        type: string
        default: "true"
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
      - name: allow_global
        env: ALLOW_GLOBAL
        required: false
        type: string
        default: "false"
      - name: allow_admin_privileges
        env: ALLOW_ADMIN_PRIVILEGES
        required: false
        type: string
        default: "false"
  blue-green/status:
    script: mariadb/blue-green/status.sh
    description: "Read MariaDB multiCluster, version, and replication status for blue/green runbooks"
    timeout: 2m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: resource
        env: MARIADB_RESOURCE
        required: false
        type: string
        default: mariadb
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
        default: mariadb
      - name: container
        env: MARIADB_CONTAINER
        required: false
        type: string
        default: mariadb
  blue-green/create:
    script: mariadb/blue-green/create.sh
    description: "Provision Green from a Blue physical backup (backup -> bootstrap -> upgrade) in one task"
    timeout: 30m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: blue_name
        env: BLUE_NAME
        required: true
        type: string
      - name: green_name
        env: GREEN_NAME
        required: true
        type: string
      - name: green_namespace
        env: GREEN_NAMESPACE
        required: false
        type: string
        default: ""
      - name: green_image
        env: GREEN_IMAGE
        required: true
        type: string
      - name: target_image
        env: TARGET_IMAGE
        required: false
        type: string
        default: ""
      # Required by the public contract; internal-step (peer orchestration)
      # calls carry the orchestrator's own values to satisfy the schema.
      - name: peer_aqsh_url
        env: PEER_AQSH_URL
        required: true
        type: string
      - name: peer_token
        env: PEER_TOKEN
        required: true
        type: string
      - name: internal_step
        env: INTERNAL_STEP
        required: false
        type: string
        default: ""
      - name: backup_name
        env: BACKUP_NAME
        required: false
        type: string
        default: physicalbackup-blue
      # S3 backup location (bucket / prefix / endpoint) is NOT a task input: it is
      # resolved internally from deploy-time config + the per-namespace convention
      # (db-backups, mariadb/<namespace>, MINIO_ENDPOINT), the same one restore
      # reads. Blue writes with its own config; green re-resolves with its own, so
      # each cluster uses its own MinIO endpoint. BACKUP_BUCKET / BACKUP_PREFIX /
      # BACKUP_ENDPOINT stay env-readable as advanced overrides only.
      # S3 region + access credentials (region / access Secret / key names) are
      # managed-DB internals resolved from platform convention, not task inputs.
      # BACKUP_REGION / BACKUP_ACCESS_SECRET / BACKUP_ACCESS_KEY / BACKUP_SECRET_KEY
      # stay env-overridable only.
      - name: backup_target
        env: BACKUP_TARGET
        required: false
        type: string
        default: PreferReplica
      - name: backup_compression
        env: BACKUP_COMPRESSION
        required: false
        type: string
        default: bzip2
      # The MariaDB root Secret (name / key) is a managed-DB internal following the
      # platform convention (mariadb / password), not a task input. ROOT_SECRET_NAME
      # / ROOT_SECRET_KEY stay env-overridable only.
      - name: storage_size
        env: STORAGE_SIZE
        required: false
        type: string
        default: 1Gi
      - name: replicas
        env: REPLICAS
        required: false
        type: string
        default: "2"
      - name: gtid_domain_id
        env: GTID_DOMAIN_ID
        required: false
        type: string
        default: "1"
      - name: server_id_start_index
        env: SERVER_ID_START_INDEX
        required: false
        type: string
        default: "20"
      - name: blue_host
        env: BLUE_HOST
        required: false
        type: string
        default: peer-db-proxy.db-ops.svc.cluster.local
      - name: green_host
        env: GREEN_HOST
        required: false
        type: string
        default: ""
      - name: wait_timeout
        env: WAIT_TIMEOUT
        required: false
        type: string
        default: 10m
      - name: peer_timeout
        env: PEER_TIMEOUT
        required: false
        type: string
        default: "900"
      - name: lag_threshold
        env: LAG_THRESHOLD
        required: false
        type: string
        default: "0"
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  blue-green/switchover:
    script: mariadb/blue-green/switchover.sh
    description: "Switch the multiCluster primary from Blue to Green with built-in guardrails and rollback"
    timeout: 20m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: blue_name
        env: BLUE_NAME
        required: true
        type: string
      - name: green_name
        env: GREEN_NAME
        required: true
        type: string
      - name: green_namespace
        env: GREEN_NAMESPACE
        required: false
        type: string
        default: ""
      # Required by the public contract; internal-step (peer orchestration)
      # calls carry the orchestrator's own values to satisfy the schema.
      - name: peer_aqsh_url
        env: PEER_AQSH_URL
        required: true
        type: string
      - name: peer_token
        env: PEER_TOKEN
        required: true
        type: string
      - name: internal_step
        env: INTERNAL_STEP
        required: false
        type: string
        default: ""
      - name: primary
        env: BLUE_GREEN_PRIMARY
        required: false
        type: string
        default: ""
      - name: expected_primary
        env: EXPECTED_PRIMARY
        required: false
        type: string
        default: ""
      - name: expected_blue_version
        env: EXPECTED_BLUE_VERSION
        required: false
        type: string
        default: ""
      - name: expected_green_version
        env: EXPECTED_GREEN_VERSION
        required: false
        type: string
        default: ""
      - name: lag_threshold
        env: LAG_THRESHOLD
        required: false
        type: string
        default: "0"
      - name: check_replication
        env: CHECK_REPLICATION
        required: false
        type: string
        default: "true"
      - name: skip_write_probe
        env: SKIP_WRITE_PROBE
        required: false
        type: string
        default: "false"
      - name: database
        env: PROBE_DATABASE
        required: false
        type: string
        default: bgtest
      - name: table
        env: PROBE_TABLE
        required: false
        type: string
        default: events
      - name: id
        env: PROBE_ID
        required: false
        type: string
        default: "1"
      - name: note
        env: PROBE_NOTE
        required: false
        type: string
        default: aqsh-write-probe
      - name: peer_timeout
        env: PEER_TIMEOUT
        required: false
        type: string
        default: "540"
      - name: switchover_timeout
        env: SWITCHOVER_TIMEOUT
        required: false
        type: string
        default: "300"
      - name: long_tx_threshold
        env: LONG_TX_THRESHOLD
        required: false
        type: string
        default: "60"
      # Empty default on purpose: the orchestrator decides when the peer's
      # internal validate must enforce read_only (pre-switchover only).
      - name: expect_green_read_only
        env: EXPECT_GREEN_READ_ONLY
        required: false
        type: string
        default: ""
      # gtid_target / gtid_timeout are peer-orchestration internals (gtid-wait).
      - name: gtid_target
        env: GTID_TARGET
        required: false
        type: string
        default: ""
      - name: gtid_timeout
        env: GTID_TIMEOUT
        required: false
        type: string
        default: "0"
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  blue-green/delete:
    script: mariadb/blue-green/delete.sh
    description: "Delete a Green deployment (MariaDB CR, ExternalMariaDB refs, optional PhysicalBackup)"
    timeout: 6m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
        default: mariadb-green
      - name: blue_name
        env: BLUE_NAME
        required: false
        type: string
        default: ""
      - name: delete_external
        env: DELETE_EXTERNAL
        required: false
        type: string
        default: "true"
      - name: backup_name
        env: BACKUP_NAME
        required: false
        type: string
        default: ""
      - name: wait_timeout
        env: WAIT_TIMEOUT
        required: false
        type: string
        default: 5m
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  migration/export-db-env-to-vault:
    script: mariadb/migration/export-db-env-to-vault.sh
    description: "Read values from a MariaDB pod's environment and/or an existing Kubernetes Secret, and write them to a Vault KV-v2 path — values are never returned in the task result or logged, since this task is reachable by any system:serviceaccounts caller. At least one of (mdb + envs) or (secret_name + secret_keys) is required; both may be given together. Each envs/secret_keys entry may be NAME or NAME=vault_key to store it under a different Vault key; all found values land in one Vault write. Requires Vault AppRole to be configured as deploy-time internal config (VAULT_ADDR/VAULT_MOUNT/VAULT_ROLE_ID/VAULT_SECRET_ID); fails clearly with VAULT_NOT_CONFIGURED otherwise."
    timeout: 2m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      # - name: resource
      #   env: MARIADB_RESOURCE
      #   required: false
      #   type: string
      #   default: mariadb
      # mdb is required only when envs is given (validated in-script, not
      # here): this task reads pod credentials off a specific instance on
      # purpose, so the caller must name it explicitly rather than risk a
      # silently-wrong target if the namespace's instance set changes.
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
        default: ""
      # - name: container
      #   env: MARIADB_CONTAINER
      #   required: false
      #   type: string
      #   default: mariadb
      # Comma-separated; each entry is VAR or VAR=vault_key (e.g.
      # "MARIADB_ROOT_PASSWORD=root_password,MARIADB_DATABASE"). Required
      # together with mdb, unless secret_name/secret_keys are given instead.
      - name: envs
        env: ENVS_STR
        required: false
        type: string
        default: ""
      # secret_name/secret_keys: an alternative (combinable) source to envs —
      # reads from an existing Secret instead of a pod's env, for credentials
      # that never appear as pod env vars (e.g. a non-root account's password,
      # which create-account stores in a Secret, not the pod's environment).
      # secret_name is required only when secret_keys is given.
      - name: secret_name
        env: SECRET_NAME
        required: false
        type: string
        default: ""
      # Comma-separated; each entry is KEY or KEY=vault_key.
      - name: secret_keys
        env: SECRET_KEYS_STR
        required: false
        type: string
        default: ""
      # vault_path is where the values land, not who can write them: Vault
      # identity (VAULT_ROLE_ID/VAULT_SECRET_ID) stays deploy-time-only config
      # (see script header) so a caller can never redirect writes under a
      # different Vault identity than this deployment's.
      - name: vault_path
        env: VAULT_PATH
        required: true
        type: string
        pattern: '^[A-Za-z0-9._/-]+$'
  migration/import-db-env-from-vault:
    script: mariadb/migration/import-db-env-from-vault.sh
    description: "Read a Vault KV-v2 path written by migration/export-db-env-to-vault and materialize its values as a Kubernetes Secret — values are never returned in the task result or logged, since this task is reachable by any system:serviceaccounts caller. Each keys entry may be VAULT_KEY or VAULT_KEY=secret_key to store it under a different Secret key than its Vault key name; omit keys entirely to import every key at the path. The Secret write is idempotent — re-running updates it in place. Requires Vault AppRole to be configured as deploy-time internal config (VAULT_ADDR/VAULT_MOUNT/VAULT_ROLE_ID/VAULT_SECRET_ID); fails clearly with VAULT_NOT_CONFIGURED otherwise."
    timeout: 2m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: vault_path
        env: VAULT_PATH
        required: true
        type: string
        pattern: '^[A-Za-z0-9._/-]+$'
      # secret_name is the Kubernetes Secret this task creates/updates in
      # namespace — caller picks it so e.g. migration/setup-replication's
      # --repl-password-secret can reference it directly.
      - name: secret_name
        env: SECRET_NAME
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      # Comma-separated; each entry is VAULT_KEY or VAULT_KEY=secret_key.
      # Omit to import every key at vault_path as-is.
      - name: keys
        env: KEYS_STR
        required: false
        type: string
        default: ""
  migration/preflight:
    script: mariadb/migration/migration-preflight.sh
    description: "Pre-flight readiness checks for a MariaDB migration source: pod exec and MinIO connectivity. MinIO options fall back to this deployment's MINIO_*_DEFAULT internal config when omitted."
    timeout: 3m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: resource
        env: MARIADB_RESOURCE
        required: false
        type: string
        default: mariadb
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
      - name: container
        env: MARIADB_CONTAINER
        required: false
        type: string
        default: mariadb
      # Each falls back to this deployment's MINIO_*_DEFAULT internal config
      # (aqsh-tasks/config/mariadb.env) when omitted; MinIO checks are skipped
      # with WARN only if still unset after that.
      - name: minio_endpoint
        env: MINIO_ENDPOINT
        required: false
        type: string
        default: ""
      - name: minio_access_key
        env: MINIO_ACCESS_KEY
        required: false
        type: string
        default: ""
      - name: minio_secret_key
        env: MINIO_SECRET_KEY
        required: false
        type: string
        default: ""
      - name: minio_bucket
        env: MINIO_BUCKET
        required: false
        type: string
        default: ""
  migration/check-connection:
    script: mariadb/migration/check-connection.sh
    description: "Check if a MariaDB pod can connect to a given host IP, then compare @@server_id on both sides to flag a replication collision risk. Authenticates with repl_password_secret if given (e.g. a source password relayed via migration/import-db-env-from-vault), else the pod's own MARIADB_ROOT_PASSWORD."
    timeout: 2m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: ip
        env: TARGET_IP
        required: true
        type: string
      # - name: resource
      #   env: MARIADB_RESOURCE
      #   required: false
      #   type: string
      #   default: mariadb
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
      # - name: container
      #   env: MARIADB_CONTAINER
      #   required: false
      #   type: string
      #   default: mariadb
      - name: port
        env: TARGET_PORT
        required: false
        type: string
        default: "3306"
      # Password to authenticate the target IP with. Defaults to using the
      # pod's own MARIADB_ROOT_PASSWORD, which only makes sense when the
      # target shares that password. For a cross-cluster check with a
      # differently-credentialed source, point this at the Secret
      # migration/import-db-env-from-vault relayed the source's password into.
      - name: repl_password_secret
        env: REPL_PASSWORD_SECRET
        required: false
        type: string
        default: ""
      - name: repl_password_key
        env: REPL_PASSWORD_KEY
        required: false
        type: string
        default: password
  migration/setup-replication:
    script: mariadb/migration/setup-replication.sh
    description: "Configure a MariaDB GTID replication channel. Authenticates as repl_user (default root); repl_password_secret is required for every real (dry_run=false) run regardless of repl_user — the target pod's own root password is only used as a repl_user=root, dry_run=true SQL-plan-preview convenience, never on a real run. After START SLAVE, polls the channel's Slave_IO_Running/Slave_SQL_Running for a few seconds and reports ERROR/REPLICATION_NOT_HEALTHY rather than a false DONE if the channel never comes up."
    timeout: 5m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: host
        env: REPL_HOST
        required: true
        type: string
      - name: channel
        env: REPL_CHANNEL
        required: false
        type: string
        default: ""
      - name: port
        env: REPL_PORT
        required: false
        type: string
        default: "3306"
      - name: delay
        env: REPL_DELAY
        required: false
        type: string
        default: ""
      - name: async
        env: REPL_ASYNC
        required: false
        type: string
        default: "false"
      # - name: resource
      #   env: MARIADB_RESOURCE
      #   required: false
      #   type: string
      #   default: mariadb
      - name: mdb
        env: MARIADB_NAME
        required: false
        type: string
      # - name: container
      #   env: MARIADB_CONTAINER
      #   required: false
      #   type: string
      #   default: mariadb
      # Account CHANGE MASTER authenticates as. Default: root. Non-root
      # requires repl_password_secret — there is no sensible default password
      # for an arbitrary user (see setup-replication.sh validation).
      - name: repl_user
        env: REPL_USER
        required: false
        type: string
        default: root
      - name: repl_password_secret
        env: REPL_PASSWORD_SECRET
        required: false
        type: string
        default: ""
      - name: repl_password_key
        env: REPL_PASSWORD_KEY
        required: false
        type: string
        default: password
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  migration/restore:
    script: mariadb/migration/restore.sh
    description: "Restore a MariaDB instance from a specific physical backup at a caller-specified MinIO endpoint. backup_file is the S3 prefix path to the exact backup directory (sets bootstrapFrom.s3.prefix directly). MinIO options fall back to this deployment's MINIO_*_DEFAULT internal config when omitted. Fails clearly if the backup cannot be found in MinIO before applying anything. The minio_secret_key is written to a temporary Kubernetes Secret and never logged or returned. image and storage_size are auto-detected from any existing instance in the namespace; required inputs for a fresh migration-destination namespace. root_secret_name/root_secret_key default to the platform's own convention (mariadb/password); a migration caller can point them at the Secret migration/import-db-env-from-vault relayed the source's real root password into."
    timeout: 20m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      # backup_file is the S3 prefix path to the exact backup directory, e.g.
      # mariadb/source-ns/mariadb-migration-20260712143022. Used directly as
      # bootstrapFrom.s3.prefix — the operator restores that specific backup.
      - name: backup_file
        env: BACKUP_FILE
        required: true
        type: string
      # Each falls back to this deployment's MINIO_*_DEFAULT internal config
      # (aqsh-tasks/config/mariadb.env) when omitted; the task fails clearly
      # if still unset after that.
      - name: minio_endpoint
        env: MINIO_ENDPOINT
        required: false
        type: string
        default: ""
      - name: minio_access_key
        env: MINIO_ACCESS_KEY
        required: false
        type: string
        default: ""
      # minio_secret_key is sensitive: the script writes it to a temporary
      # Kubernetes Secret and unsets the env var before any CR is applied.
      # The raw value never appears in logs or the result JSON.
      - name: minio_secret_key
        env: MINIO_SECRET_KEY
        required: false
        type: string
        default: ""
      - name: minio_bucket
        env: MINIO_BUCKET
        required: false
        type: string
        default: ""
      # image and storage_size: auto-detected from the namespace's existing
      # MariaDB CR when omitted. Required for a fresh destination namespace.
      - name: image
        env: RESTORE_IMAGE
        required: false
        type: string
        default: ""
      - name: storage_size
        env: STORAGE_SIZE
        required: false
        type: string
        default: ""
      - name: target
        env: RESTORE_TARGET
        required: false
        type: string
        default: ""
      # Root credential Secret the restored CR's rootPasswordSecretKeyRef
      # points at. Defaults to the platform's own convention ("mariadb"/
      # "password") when omitted. A migration caller sets these to point at
      # the Secret migration/import-db-env-from-vault relayed the source's
      # real root password into — otherwise the operator's Ready-probe
      # authenticates against the physically-restored DB with whatever
      # unrelated password the destination namespace's default secret holds.
      - name: root_secret_name
        env: ROOT_SECRET_NAME
        required: false
        type: string
        default: ""
      - name: root_secret_key
        env: ROOT_SECRET_KEY
        required: false
        type: string
        default: ""
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      # Unlike other wait_timeout inputs, "0" (skip-wait) is rejected: the
      # MinIO credential Secret is temporary and deleted when this task exits,
      # so the operator must be given time to read it before that happens.
      - name: wait_timeout
        env: WAIT_TIMEOUT
        required: false
        type: string
        default: 10m
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  migration/sourcedb-backup:
    script: mariadb/migration/sourcedb-backup.sh
    description: "Physical (mariabackup) backup of a migration source MariaDB to a caller-specified external MinIO endpoint. MinIO options fall back to this deployment's MINIO_*_DEFAULT internal config when omitted, same as migration/preflight. The minio_secret_key is written immediately to a temporary Kubernetes Secret and never logged or returned in the result."
    timeout: 20m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      # Each falls back to this deployment's MINIO_*_DEFAULT internal config
      # (aqsh-tasks/config/mariadb.env) when omitted; the task fails clearly
      # if still unset after that.
      - name: minio_endpoint
        env: MINIO_ENDPOINT
        required: false
        type: string
        default: ""
      - name: minio_access_key
        env: MINIO_ACCESS_KEY
        required: false
        type: string
        default: ""
      # minio_secret_key is sensitive: the script writes it to a temporary
      # Kubernetes Secret immediately and unsets the env var before any backup
      # CR is applied. The raw value never appears in logs or the result JSON.
      - name: minio_secret_key
        env: MINIO_SECRET_KEY
        required: false
        type: string
        default: ""
      - name: minio_bucket
        env: MINIO_BUCKET
        required: false
        type: string
        default: ""
      - name: mariadb
        env: MARIADB_NAME
        required: false
        type: string
      - name: target
        env: BACKUP_TARGET
        required: false
        type: string
        default: PreferReplica
      - name: compression
        env: BACKUP_COMPRESSION
        required: false
        type: string
        default: bzip2
      - name: backup_name
        env: BACKUP_NAME
        required: false
        type: string
        default: ""
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      # Unlike other wait_timeout inputs, "0" (skip-wait) is rejected: the
      # MinIO credential Secret is temporary and deleted when this task exits,
      # so the operator must be given time to read it before that happens.
      - name: wait_timeout
        env: WAIT_TIMEOUT
        required: false
        type: string
        default: 10m
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  backup:
    script: backup/backup-mariadb.sh
    description: "Create a logical backup for the database identified by namespace"
    timeout: 15m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
  physical-backup:
    script: mariadb/physical-backup.sh
    description: "Create a restorable physical backup for the database identified by namespace"
    timeout: 20m
    allowed_groups: ["system:serviceaccounts"]
    # The namespace is the database identity; the S3 backup location and
    # credentials are platform internals resolved automatically (env-overridable
    # but not task inputs), matching restore.
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      # wait_timeout doubles as the wait switch: "0" returns without waiting,
      # any positive duration (e.g. 10m) waits up to that long for Complete.
      - name: wait_timeout
        env: WAIT_TIMEOUT
        required: false
        type: string
        default: 10m
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  logical-backup:
    script: mariadb/logical-backup.sh
    description: "Create a logical backup for the database identified by namespace"
    timeout: 20m
    allowed_groups: ["system:serviceaccounts"]
    # Same user-facing surface as physical-backup, minus the physical-only
    # target/compression knobs: the namespace is the database identity; the S3
    # location and credentials are platform internals resolved automatically.
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      # wait_timeout doubles as the wait switch: "0" returns without waiting,
      # any positive duration (e.g. 10m) waits up to that long for Complete.
      - name: wait_timeout
        env: WAIT_TIMEOUT
        required: false
        type: string
        default: 10m
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  list-backups:
    script: backup/list-backups-mariadb.sh
    description: "List backups for the database identified by namespace; read-only"
    timeout: 2m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
  delete-backup:
    script: backup/delete-backup-mariadb.sh
    description: "Delete a named backup for the database identified by namespace; mutating (dry_run + confirm)"
    timeout: 5m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: backup
        env: BACKUP_NAME
        required: true
        type: string
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  restore:
    script: mariadb/restore.sh
    description: "Restore the database identified by namespace from a physical backup, optionally to a point in time"
    timeout: 20m
    allowed_groups: ["system:serviceaccounts"]
    # The namespace identifies the managed database; the engine version, storage
    # size, restored instance name, source instance, backup location, and
    # credentials are platform internals resolved automatically (some remain
    # env-readable as advanced operator overrides, but are not task inputs).
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: target_time
        env: TARGET_TIME
        required: false
        type: string
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      # wait_timeout doubles as the wait switch: "0" returns without waiting,
      # any positive duration (e.g. 10m) waits up to that long for Ready.
      - name: wait_timeout
        env: WAIT_TIMEOUT
        required: false
        type: string
        default: 10m
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  logical-restore:
    script: mariadb/logical-restore.sh
    description: "Restore the database identified by namespace from a logical backup into a new database instance"
    timeout: 20m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      # Which Backup to restore from; omit to use the most recent one.
      - name: backup
        env: BACKUP_NAME
        required: false
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
      # wait_timeout doubles as the wait switch: "0" returns without waiting,
      # any positive duration (e.g. 10m) waits up to that long for Ready.
      - name: wait_timeout
        env: WAIT_TIMEOUT
        required: false
        type: string
        default: 10m
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
  # Secrets gateway — safe CRUD for K8s Secrets in the DB namespace (see
  # docs/mariadb/secrets.md). Values arrive PGP-encrypted against the
  # deployment key (secrets/pubkey); plaintext never crosses the gateway.
  # Upsert is plan -> apply with a stateless CAS plan_hash (reconfig model);
  # delete is confirm-gated. The PGP key path and the protected-secret list
  # are deliberately NOT task inputs — internal config + live auto-detect
  # only (CLAUDE.md "Configuration Layers").
  secrets/pubkey:
    script: secrets/pubkey.sh
    description: "Return the deployment PGP public key callers encrypt secrets payloads against"
    timeout: 1m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: log_level
        env: LOG_LEVEL
        required: false
        type: string
        default: ""
        pattern: '^(DEBUG|INFO|WARN|ERROR)?$'
  secrets/get:
    script: secrets/get.sh
    description: "Describe a Secret: key names + value sha256 fingerprints (values never returned)"
    timeout: 5m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: secret_name
        env: SECRET_NAME
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
      - name: log_level
        env: LOG_LEVEL
        required: false
        type: string
        default: ""
        pattern: '^(DEBUG|INFO|WARN|ERROR)?$'
  secrets/plan:
    script: secrets/plan.sh
    description: "Read-only upsert preview for a PGP-encrypted secret payload (returns plan_hash)"
    timeout: 5m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: secret_name
        env: SECRET_NAME
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
      - name: payload
        env: SECRETS_PAYLOAD
        required: true
        type: string
      - name: mode
        env: SECRETS_MODE
        required: false
        type: string
        default: ""
        pattern: '^(upsert|add_only|skip_existing)?$'
      - name: log_level
        env: LOG_LEVEL
        required: false
        type: string
        default: ""
        pattern: '^(DEBUG|INFO|WARN|ERROR)?$'
  secrets/apply:
    script: secrets/apply.sh
    description: "Execute a planned secret upsert (CAS on plan_hash; merge-only, values stdin-only)"
    timeout: 5m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: secret_name
        env: SECRET_NAME
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
      - name: payload
        env: SECRETS_PAYLOAD
        required: true
        type: string
      - name: mode
        env: SECRETS_MODE
        required: false
        type: string
        default: ""
        pattern: '^(upsert|add_only|skip_existing)?$'
      - name: plan_hash
        env: SECRETS_PLAN_HASH
        required: true
        type: string
        pattern: '^sec[0-9a-f]{24}$'
      - name: requested_by
        env: REQUESTED_BY
        required: false
        type: string
        default: ""
      - name: request_id
        env: REQUEST_ID
        required: false
        type: string
        default: ""
      - name: log_level
        env: LOG_LEVEL
        required: false
        type: string
        default: ""
        pattern: '^(DEBUG|INFO|WARN|ERROR)?$'
  secrets/delete:
    script: secrets/delete.sh
    description: "Delete a Secret (confirm=false previews key names/fingerprints; confirm=true deletes)"
    timeout: 5m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: secret_name
        env: SECRET_NAME
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
      - name: log_level
        env: LOG_LEVEL
        required: false
        type: string
        default: ""
        pattern: '^(DEBUG|INFO|WARN|ERROR)?$'
  # Pods gateway (see docs/mariadb/pods.md). Pure Kubernetes-level Pod
  # list/delete for this namespace's MariaDB instance. The instance itself
  # is deliberately NOT a task input — same auto-detect tier as
  # list-backups/delete-backup (CLAUDE.md "Configuration Layers").
  pods/list:
    script: mariadb/pods/list.sh
    description: "Read-only: list the live Pods belonging to this namespace's MariaDB instance"
    timeout: 2m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: log_level
        env: LOG_LEVEL
        required: false
        type: string
        default: ""
        pattern: '^(DEBUG|INFO|WARN|ERROR)?$'
  pods/delete:
    script: mariadb/pods/delete.sh
    description: "Delete a Pod belonging to this namespace's MariaDB instance (dry_run -> confirm); the StatefulSet recreates it"
    timeout: 2m
    allowed_groups: ["system:serviceaccounts"]
    input:
      - name: namespace
        env: DB_NAMESPACE
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: target_pod
        env: TARGET_POD
        required: true
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      - name: dry_run
        env: DRY_RUN
        required: false
        type: string
        default: "true"
        pattern: '^(true|false)$'
      - name: confirm
        env: CONFIRM
        required: false
        type: string
        default: "false"
      - name: pod_uid
        env: POD_UID
        required: false
        type: string
        default: ""
        pattern: '^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})?$'
      - name: log_level
        env: LOG_LEVEL
        required: false
        type: string
        default: ""
        pattern: '^(DEBUG|INFO|WARN|ERROR)?$'
