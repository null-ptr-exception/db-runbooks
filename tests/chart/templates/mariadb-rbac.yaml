{{- if .Values.mariadbRbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aqsh-mariadb-manager
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["mariadb"]
    # patch/update: restore-in-place temporarily fences rollout with OnDelete.
    # The v24 operator reconciles replicas, so the task never scales this STS.
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    # delete: pods/delete gateway task (see docs/mariadb/pods.md). This grant
    # is namespace-wide and unscoped; the actual boundary is in code, which
    # only ever targets a Pod whose live ownerReferences name the resolved
    # instance's own StatefulSet (mariadb_list_member_pods).
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Hand-rolled physical restore may create a datadir PVC for a new instance.
  # v24 in-place restore only gets/lists existing PVCs and never deletes them.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # Hand-rolled new-instance physical restore creates and cleans a prepare Job.
    # In-place restore uses MariaDB.spec.initContainers and creates no Job.
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    # Shared gateway rule: create-account itself only reads a caller-provided
    # password Secret (get). create/patch/delete remain necessary for the
    # secrets/* task family, whose protected-name gate is enforced in code.
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    # Resolve non-secret S3 settings referenced by MariaDB.spec.env/envFrom.
    verbs: ["get"]
  - apiGroups: [{{ .Values.mariadb.operatorGroup | quote }}, "mariadb.mmontes.io"]
    resources: ["mariadbs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [{{ .Values.mariadb.operatorGroup | quote }}, "mariadb.mmontes.io"]
    resources: ["externalmariadbs", "physicalbackups"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Logical backup/restore via the operator Backup/Restore CRs (present on both
  # operator generations).
  - apiGroups: [{{ .Values.mariadb.operatorGroup | quote }}, "mariadb.mmontes.io"]
    resources: ["backups", "restores"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
{{- $root := . }}
{{- $namespaces := concat (list .Values.mariadb.namespace) (.Values.mariadbRbac.namespaces | default (list)) | uniq }}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aqsh-mariadb-manager
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aqsh-mariadb-manager
subjects:
  - kind: ServiceAccount
    name: kube-auth-proxy
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
