repositories:
  - name: istio
    url: https://istio-release.storage.googleapis.com/charts

helmDefaults:
  skipSchemaValidation: true

releases:
  # cluster-a: fedauth reader RBAC
  - name: mariadb-rbac-a
    chart: ../chart
    namespace: db-ops
    createNamespace: true
    kubeContext: kind-cluster-a
    values:
      - federatedAuthReader:
          enabled: true

  # cluster-b: fedauth reader RBAC + test-client
  - name: mariadb-client
    chart: ../chart
    namespace: db-ops
    createNamespace: true
    kubeContext: kind-cluster-b
    values:
      - federatedAuthReader:
          enabled: true
        testClient:
          enabled: true

  # cluster-a: MariaDB instance (creates mariadb-1 namespace)
  - name: mariadb-1
    chart: ../chart
    namespace: mariadb-1
    createNamespace: true
    kubeContext: kind-cluster-a
    values:
      - mariadb:
          enabled: true
          namespace: mariadb-1
          # Replicated so the switch-primary e2e can promote a replica.
          replicas: 3
          objectStorage:
            enabled: true
            secretName: mariadb-storage-primary
            prefix: tenant-a/database
        databaseGateway:
          enabled: true
          testClient:
            enabled: true
        # Publish this primary on the shared gateway's MySQL listener (3306 →
        # nodePort 30091) so cluster-b can reach it, and provide the local half
        # of the mesh contract. In the real deployment Cilium does both.
        replicationMesh:
          expose:
            enabled: true
          peer:
            enabled: true
            externalName: mariadb-primary.mariadb-1.svc.cluster.local

  # cluster-a: a separate Envoy workload owned and lifecycle-managed by the
  # MariaDB namespace. The shared control-plane gateway is intentionally not
  # used for these database TCP listeners.
  - name: database-gateway
    chart: istio/gateway
    version: 1.24.3
    namespace: mariadb-1
    createNamespace: true
    kubeContext: kind-cluster-a
    needs:
      - kind-cluster-a/mariadb-1/mariadb-1
    values:
      - autoscaling:
          enabled: false
        service:
          type: ClusterIP
          ports:
            - name: status-port
              port: 15021
              protocol: TCP
              targetPort: 15021
            - name: tcp-mariadb-rw
              port: 3306
              protocol: TCP
              targetPort: 3306
            - name: tcp-mariadb-ro
              port: 3307
              protocol: TCP
              targetPort: 3307
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

  # A second database with an independent workload contract proves one AQSH
  # deployment can select different per-database object prefixes/references.
  - name: mariadb-2
    chart: ../chart
    namespace: mariadb-2
    createNamespace: true
    kubeContext: kind-cluster-a
    values:
      - mariadb:
          enabled: true
          namespace: mariadb-2
          objectStorage:
            enabled: true
            secretName: mariadb-storage-secondary
            endpoint: http://minio-secondary.kind-b.test:30080
            bucket: db-backups-secondary
            prefix: tenant-b/database

  # cluster-b: MinIO for backup tests
  - name: minio
    chart: ../chart
    namespace: minio
    createNamespace: true
    kubeContext: kind-cluster-b
    values:
      - minio:
          enabled: true
        gateway:
          enabled: true
          virtualServices:
            - name: minio
              host: "minio.kind-b.test"
              backendHost: minio.minio.svc.cluster.local
              backendPort: 9000
            - name: minio-secondary
              host: "minio-secondary.kind-b.test"
              backendHost: minio.minio.svc.cluster.local
              backendPort: 9000

  # cluster-a: fedauth, aqsh-mariadb, redis, rbac, gateway
  - name: mariadb-server
    chart: ../chart
    namespace: db-ops
    createNamespace: true
    kubeContext: kind-cluster-a
    needs:
      - kind-cluster-a/mariadb-1/mariadb-1
    values:
      - federatedAuth:
          enabled: true
          authorizedClients:
            - "cluster-a/db-ops/kube-auth-proxy"
            - "cluster-b/db-ops/kube-auth-proxy"
        redis:
          enabled: true
        aqsh:
          enabled: true
          tasksConfig: /etc/aqsh/task-mariadb.yaml
          workerQueues: mariadb
          config:
            mariadb.env: |
              MINIO_ENDPOINT=http://minio.kind-b.test:30080
              # Cross-cluster replication. Necessarily per-cluster: each AQSH's
              # peer is the OTHER cluster, so this cannot live in the shared
              # aqsh-tasks/config/mariadb.env template.
              # 30091 is the sandbox's gateway nodePort standing in for the real
              # deployment's 3306 — the whole reason the port is configurable.
              REPL_PEER_PORT_DEFAULT=30091
              REPL_PEER_AQSH_URL_DEFAULT=http://aqsh-mariadb.kind-b.test:30080
          authProxy:
            tokenReviewURL: "http://fedauth-mariadb.kind-a.test:30080"
        mariadbRbac:
          enabled: true
          namespaces:
            - mariadb-2
        gateway:
          enabled: true
          virtualServices:
            - name: fedauth-mariadb
              host: "fedauth-mariadb.kind-a.test"
              backendHost: kube-federated-auth.db-ops.svc.cluster.local
              backendPort: 8080
            - name: aqsh-mariadb
              host: "aqsh-mariadb.kind-a.test"
              backendHost: aqsh.db-ops.svc.cluster.local
              backendPort: 4180

  # cluster-b: MariaDB instance (creates mariadb-1 namespace)
  - name: mariadb-1-b
    chart: ../chart
    namespace: mariadb-1
    createNamespace: true
    kubeContext: kind-cluster-b
    values:
      - mariadb:
          enabled: true
          namespace: mariadb-1
          # Replicated so the CR carries spec.replication — a standalone
          # instance has no replication configuration for a standby link to
          # attach to.
          replicas: 2
          # Disjoint from cluster-a's range (its default gives 10, 11, 12).
          # Equal server_ids across the two clusters make MariaDB refuse the
          # link outright (errno 1593), and the field is immutable, so this has
          # to be right at deploy time.
          serverIdStartIndex: 100
          objectStorage:
            enabled: true
            secretName: mariadb-storage-destination
            prefix: tenant-a/database
        # The standby half of the mesh contract: <namespace>-rw resolves out of
        # this cluster to cluster-a's gateway. Any *.kind-a.test name works —
        # CoreDNS maps them all to the cluster-a node IP.
        replicationMesh:
          peer:
            enabled: true
            externalName: mariadb.kind-a.test

  # cluster-b: aqsh-mariadb, redis, rbac, gateway
  - name: mariadb-server-b
    chart: ../chart
    namespace: db-ops
    createNamespace: true
    kubeContext: kind-cluster-b
    needs:
      - kind-cluster-b/mariadb-1/mariadb-1-b
    values:
      - redis:
          enabled: true
        aqsh:
          enabled: true
          tasksConfig: /etc/aqsh/task-mariadb.yaml
          workerQueues: mariadb
          config:
            mariadb.env: |
              MINIO_ENDPOINT=http://minio.kind-b.test:30080
              # This is the standby side: its peer is cluster-a.
              REPL_PEER_PORT_DEFAULT=30091
              REPL_PEER_AQSH_URL_DEFAULT=http://aqsh-mariadb.kind-a.test:30080
          authProxy:
            tokenReviewURL: "http://fedauth-mariadb.kind-a.test:30080"
        mariadbRbac:
          enabled: true
        gateway:
          enabled: true
          virtualServices:
            - name: aqsh-mariadb-b
              host: "aqsh-mariadb.kind-b.test"
              backendHost: aqsh.db-ops.svc.cluster.local
              backendPort: 4180
