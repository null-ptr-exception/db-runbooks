{{- if .Values.mariadbRbac.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aqsh-mariadb-manager
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["mariadb"]
    # patch/update: replication/attach quiesces the standby before overwriting
    # its datadir in place, by scaling the StatefulSet to 0 and back. Restoring
    # into a running mysqld would corrupt it, and the alternative — deleting and
    # recreating the instance — is irreversible.
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["mariadb"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    # delete: pods/delete gateway task (see docs/mariadb/pods.md). This grant
    # is namespace-wide and unscoped; the actual boundary is in code, which
    # only ever targets a Pod whose live ownerReferences name the resolved
    # instance's own StatefulSet (mariadb_list_member_pods).
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Hand-rolled physical restore on a legacy operator pre-creates the datadir PVC
  # and runs a prepare Job (mbstream + mariabackup --prepare) before the new
  # instance adopts the PVC.
  # delete: replication/rebuild must remove the standby's data volumes — a
  # StatefulSet's PVCs outlive its CR, and a surviving datadir makes the
  # operator skip bootstrapFrom and return the stale data the rebuild exists to
  # replace.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # delete: the in-place restore Jobs are cleaned up after they succeed, and a
    # stale one from an earlier attempt must not block a retry (a Job's pod
    # template is immutable, so it cannot simply be re-applied).
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    # patch: tag the managed account password Secret with an owner annotation
    # (create-account collision guard).
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    # Resolve non-secret S3 settings referenced by MariaDB.spec.env/envFrom.
    verbs: ["get"]
  - apiGroups: [{{ .Values.mariadb.operatorGroup | quote }}, "mariadb.mmontes.io"]
    resources: ["mariadbs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [{{ .Values.mariadb.operatorGroup | quote }}, "mariadb.mmontes.io"]
    resources: ["externalmariadbs", "physicalbackups"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Logical backup/restore via the operator Backup/Restore CRs (present on both
  # operator generations).
  - apiGroups: [{{ .Values.mariadb.operatorGroup | quote }}, "mariadb.mmontes.io"]
    resources: ["backups", "restores"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
{{- $root := . }}
{{- $namespaces := concat (list .Values.mariadb.namespace) (.Values.mariadbRbac.namespaces | default (list)) | uniq }}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aqsh-mariadb-manager
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aqsh-mariadb-manager
subjects:
  - kind: ServiceAccount
    name: kube-auth-proxy
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
