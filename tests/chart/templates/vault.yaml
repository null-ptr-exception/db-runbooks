{{- if .Values.vault.enabled }}
# Dev-mode Vault: auto-unseals, mounts KV-v2 at secret/ automatically, and
# accepts the configured root token — no `vault operator init/unseal` step
# needed. setup_suite.bash uses that root token once to provision an AppRole
# for aqsh; nothing else in this sandbox uses the root token afterward.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: {{ .Values.vault.image }}
          args:
            - server
            - -dev
            - -dev-root-token-id={{ .Values.vault.devRootToken }}
            - -dev-listen-address=0.0.0.0:8200
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
          ports:
            - name: api
              containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    app: vault
spec:
  selector:
    app: vault
  ports:
    - name: api
      port: 8200
      targetPort: 8200
{{- end }}
